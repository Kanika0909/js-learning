<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub User Search</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-gray-100 text-gray-800">
    <main class="mx-auto mt-12 w-11/12 max-w-lg rounded-2xl bg-white p-6 shadow-lg sm:p-8">
        <h1 class="text-center text-3xl font-bold">
            GitHub User Search
        </h1>

        <p class="mt-2 text-center text-gray-500">
            Find any GitHub developer's profile
        </p>

        <form id="searchForm" class="mt-6 flex flex-col gap-3 sm:flex-row">
            <input
             type="text"
             id="username"
             placeholder="Enter github username"
             aria-label="Github Username"
             required
             class="min-w-0 flex-1 rounded-lg border border-gray-300 px-4 py-3 outline-none focus:border-blue-500 focus:ring-blue-200"
             >

             <button 
                type="submit"
                id="searchBtn"
                class="rounded-lg bg-gray-900 px-5 py-3 font-semibold text-white transition hover:bg-gray-700 disabled:cursor-wait disabled:opacity-60"
             >
                Search
             </button>
        </form>

        <p 
        id="message"
        role="status"
        aria-live="polite"
        class="mt-4 break-words text-center text-sm text-gray-600">
        </p>
        <section
        id="profile"
        class="mt-6 hidden rounded-xl border border-gray-200 text-center p-5">
            <img 
            id="avatar" 
            src="" 
            alt="GitHub profile picture"
            class="mx-auto h-28 w-28 rounded-full border-4 border-gray-100 object-cover" 
            >

            <h2 id="name" class="mt-4 test-2xl font-bold"></h2>
            <p id="login" class="mt-1 text-gray-500"></p>

            <div class="mt-6 grid grid-cols-3 gap-3">

                <div class="rounded-lg bg-gray-50 p-3">
                    <p id="followers" class="text=xl font-bold">0</p>
                    <p class="mto1 test-xs text-gray-500 sm:text-sm">
                        Followers
                    </p>
                </div>

                <div class="rounded-lg bg-gray-50 p-3">
                    <p id="following" class="text-xl font-bold">0</p>
                    <p class="mt-1 text-xs text-gray-500 sm:text-sm">
                        Following
                    </p>
                </div>

                <div class="rounded-lg bg-gray-50 p-3">
                    <p id="repos" class="text-xl font-bold">0</p>
                    <p class="mt-1 text-xs text-gray-500 sm:text-sm">
                        Repositories
                    </p>
                </div>
            </div>
            
            <a 
            id="profileLink"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            class="mt-6 inline-block rounded-lg bg-green-600 px-5 py-3 font-semibold text-white transition hover:bg-green-700"
            >
                View GitHub Profile
            </a>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
